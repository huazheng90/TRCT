experiment_name: diagnostics
benchmark: office_home
data_root: ./data
output_dir: ./outputs/office_home
transfers:
- [Art, Clipart]
- [Clipart, Real_World]
seeds: [0, 1, 2, 3, 4]
num_classes: 65
feat_dim: 512
eval_mode: accuracy
backend: transformers
clip_model: openai/clip-vit-base-patch16
n_ctx: 16
ctx_init: a photo of a
image_size: 224
text_logit_scale: 100.0
semantic_rank: 64
rank_eps: 0.001
residual_rank: 16
init_perturb: 0.001
j_alt: 5
lr_block: 0.1
alpha: 1.0
beta: 0.001
xi: 0.001
gamma: 0.01
rho: 0.1
eta: 0.1
kappa_cert: 0.0
zeta: 0.1
kappa_donor: 0.05
kappa_r: 2.0
j_min: 1
queue_capacity: 4096
energy_bins: 10
pi_min: 0.4
pi_max: 0.8
lambda_cf: 1.0
anchors_per_class: 2
anchor_momentum: 0.99
tau_g: 10.0
spectral_p: 1
eps_deg: 1.0e-06
lr: 0.003
weight_decay: 0.0005
momentum: 0.9
batch_size: 32
iterations_per_epoch: 1000
warmup_epochs: 10
adapt_epochs: 30
lambda_ent: 1.0
lambda_fac: 1.0
lambda_priv: 1.0
lambda_leak: 0.1
lambda_cert: 1.0
lambda_tail: 1.0
lambda_sup: 1.0
use_disentangle: true
use_counterfactual: true
log_every: 100
save_every: 1000000
device: gpu
